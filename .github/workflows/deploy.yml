name: SheetX Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff --quiet
      - run: ruff check backend/ --output-format=github --ignore E402,F401 --exit-zero

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install bandit --quiet
      - run: bandit -r backend/ -ll --exit-zero

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://sheetx.io
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # =========================================================
      # ENV File Generation (Secure Base64 Method)
      # =========================================================
      - name: Create ENV file
        run: |
          echo "" | base64 -d > .env.production

      - name: Upload ENV file to EC2
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no .env.production ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/.env.production
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sudo mv /tmp/.env.production /opt/sheetx/shared/config/.env && sudo chmod 644 /opt/sheetx/shared/config/.env"

      # =========================================================
      # NEW: Safer `if` block for catching failure logs!
      # =========================================================
      - name: Deploy to EC2
        id: deploy
        run: |
          if ! ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sudo bash /opt/sheetx/scripts/deploy.sh"; then
            echo "==================================================="
            echo "🚨 DEPLOY FAILED. FETCHING SERVER CRASH LOGS..."
            echo "==================================================="
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sudo supervisorctl status && echo '--- STDERR ---' && sudo supervisorctl tail -100 sheetx stderr && echo '--- SUPERVISOR CONFIG ---' && cat /etc/supervisor/conf.d/sheetx.conf"
            exit 1
          fi

      - name: Health check
        id: health_check
        run: |
          echo "Waiting for app to restart..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sheetx.io/api/health)
          echo "Health check HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED - triggering rollback"
            exit 1
          fi
          echo "Deploy successful - https://sheetx.io is healthy"

      - name: Rollback on failure
        if: failure() && steps.deploy.conclusion != 'skipped'
        run: |
          echo "Rolling back..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo bash /opt/sheetx/scripts/rollback.sh"
